name: CI/CD Pipeline

on:
  push:
    branches: [main, master, dev, feature/**]
  pull_request:
    branches: [main, master, dev, feature/**]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 : Continuous Integration
  #          Build Maven ARIQ
  #          (dev & feature branch )
  # ─────────────────────────────────────────────────────────────
  ci:
    name: Build
    runs-on: ubuntu-latest
    if: |
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/master'
    steps:
      - name: Checkout kode sumber
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build Maven
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload artefak JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7
