name: CI/CD Pipeline

on:
  push:
    branches: [main, master, dev, feature/**]
  pull_request:
    branches: [main, master, dev, feature/**]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 : Continuous Integration
  #          Build Maven ARIQ
  #          (dev & feature branch )
  # ─────────────────────────────────────────────────────────────
  ci:
    name: Build
    runs-on: ubuntu-latest
    if: |
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/master'
    steps:
      - name: Checkout kode sumber
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build Maven
        run: mvn -B package -DskipTests --file pom.xml

      - name: Unit Test
        run: mvn -B test --file pom.xml

      - name: Upload artefak JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  #SonarCloud Analysis
  # Continuous Inspection relingga
  # 
  # ─────────────────────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode sumber
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build & Test dengan Coverage
        run: mvn -B verify --file pom.xml

      - name: Analisis SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.scanner.skipJreProvisioning=true
            
  cd:
    name: Publish ke GitHub Packages
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout kode sumber
        uses: actions/checkout@v4

      - name: Setup JDK 17 dengan autentikasi GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Package JAR
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload artefak JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

      - name: Deploy ke GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B deploy -DskipTests --file pom.xml














            
